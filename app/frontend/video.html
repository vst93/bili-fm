<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>视频</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* 入场：对齐原版 .player-video-panel（globals.css:5440）的过渡 ——
     面板从 opacity:0 / scale(1.02) 过渡到 opacity:1 / scale(1)，时长 0.28s
     （transform 用 cubic-bezier(0.22,1,0.36,1) 缓出、opacity 用 ease）。原版由
     playerVideo.tsx 的双重 requestAnimationFrame 在挂载后加 .player-video-open
     触发；原生版同样在页面加载后双重 rAF 给 #wrap 加 .open。此前 #wrap 没有任何
     过渡，弹窗是硬切出现的。 */
  #wrap {
    position: absolute; inset: 0;
    opacity: 0; transform: scale(1.02);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
  }
  #wrap.open { opacity: 1; transform: scale(1); }
  /* 原版 .player-video-element 是 `object-fit: contain`：视频按自身比例完整装进
     面板，不足处留黑边。此前原生版没写这一条，`<video>` 的默认 `fill` 会把画面
     拉伸到窗口比例 —— 弹窗固定 960×600（8:5），16:9 的视频会被横向拉宽约 11%
     （人脸变胖、字幕变形）。窗口可自由缩放，拉伸量还会随之变化。 */
  video { width: 100%; height: 100%; background: #000; display: block; object-fit: contain; }
  /* 顶部自绘标题栏：无边框窗口下用来拖动窗口（关闭键不在这里，它常驻可见，
     见下面的 #close）。

     对齐原版视频浮层的 `body.video-open .app-title-bar`（globals.css:5511）——
     它是「默认隐去、鼠标进入窗口顶部 48px 热区才唤回」，唤出由 playerVideo.tsx
     的 `syncTitlebarHotzone`（TITLEBAR_HOTZONE_PX = 48）驱动：

       静息   opacity: 0; pointer-events: none; transition: opacity .18s ease .2s
       唤出   opacity: 1; pointer-events: auto; transition: opacity .16s ease

     pointer-events 必须跟着切：原版注释写明「不用 display:none，保留元素参与
     hover/focus 命中测试的通道」是**为了唤出**，所以隐去时明确不接管指针。

     原生版此前是 `#wrap:hover #bar, #bar.pinned`：#wrap 铺满整窗，等于鼠标只要
     在窗口里标题栏就常驻（原版只在顶部热区里出现），而且 opacity:0 时那条 32px
     的条照吃指针事件（原版隐去时不挡画面/原生控件）。 */
  #bar {
    position: absolute; top: 0; left: 0; right: 0; height: 36px; /* 原版 --titlebar-height */
    display: flex; align-items: center; gap: 10px; padding: 0 10px;
    color: #e8eef7; font: 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    z-index: 998; /* 自身开栈，::before 的 z-index:-1 才落在这条之上、画面之上 */
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease .2s; /* 退场带延迟，防热区边缘抖动 */
    --app-region: drag;
  }
  /* 原版 ::before：inset 0 0 -40% 0（比栏体高 40%）的三停靠点压暗渐变。 */
  #bar::before {
    content: ""; position: absolute; inset: 0 0 -40% 0; z-index: -1;
    pointer-events: none;
    background: linear-gradient(180deg,
      rgba(8,12,20,.72) 0%, rgba(8,12,20,.42) 55%, transparent 100%);
  }
  /* 唤出：顶部热区（JS 挂 body.titlebar-hover）或拖拽条自身被悬浮。 */
  body.titlebar-hover #bar, #bar:hover {
    opacity: 1; pointer-events: auto;
    transition: opacity .16s ease;
  }
  #title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 全宽拖动热区（原版 .app-title-bar-drag-rail，globals.css:5579）：拖拽条本体
     只有 36px（--titlebar-height），而唤出热区有 48px。这块透明层把顶部 44px
     补满，唤出后落在条体下方的余量里也能拖动窗口，消除热区底部的触发空缺。
     默认不接管指针（把 mousemove 留给页面驱动唤出），仅在拖拽条已唤出
     （body.titlebar-hover / 自身 hover / 焦点）时启用。height 44px 与右上角
     「关闭视频」按钮（top: 44px）刚好错开，不遮挡它；z-index 低于 #bar(998)
     与 #close(999)，条体与关闭键照常可点。 */
  #rail {
    position: absolute; left: 0; right: 0; top: 0; height: 44px;
    z-index: 997; pointer-events: none;
    --app-region: drag;
  }
  body.titlebar-hover #rail, #bar:hover ~ #rail, #bar:focus-within ~ #rail {
    pointer-events: auto;
  }
  /* 关闭键：对齐原版浮层的 .player-video-close（globals.css:5466）——
     38×38 正圆、墨色 45% 底，悬停 70% + 放大 1.06、按下缩 .92；图标是
     icon-park 的 Close（outline / 20 / #f1f5f9）。它**常驻可见**：原版那颗键
     是浮层右上一个独立按钮，不随会自动隐去的标题栏消失；原生版此前把它塞进
     悬停才出现的 #bar 里、还是 26×22 圆角矩形，鼠标一移开就找不到了。
     top 44 = 原版 body.video-open 的 calc(titlebar-height 36px + 8px)，
     避开顶部拖拽条。 */
  #close {
    --app-region: no-drag;
    position: absolute; top: 44px; right: 10px; z-index: 999;
    width: 38px; height: 38px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; border-radius: 50%; cursor: pointer;
    background: rgba(15,23,42,.45);
    transition: background .16s ease, transform .1s ease;
  }
  #close:hover { background: rgba(15,23,42,.7); transform: scale(1.06); }
  #close:active { transform: scale(.92); }
  /* 左下角状态胶囊：原版浮层没有这一层，它是原生版「心跳里回传 lastErr」的排障
     输出。此前默认可见、初始文案「准备中…」，于是弹窗打开后第一次心跳（1s）之前
     会在画面左下角闪一下「准备中…」。改为默认隐藏，只在出错时显形：error 监听里
     立刻打开，每秒心跳兜底（有错 block / 无错 none）。 */
  #state {
    display: none;
    position: absolute; left: 10px; bottom: 10px;
    color: #cbd5e1; font: 11px/1.5 ui-monospace, Consolas, monospace;
    background: rgba(0,0,0,.45); padding: 3px 7px; border-radius: 6px;
    pointer-events: none;
  }
  #err { color: #fca5a5; }
</style>
</head>
<body>
<div id="wrap">
  <video id="v" controls playsinline preload="auto"></video>
  <div id="bar"><span id="title"></span></div>
  <div id="rail"></div>
  <button id="close" title="关闭视频" aria-label="关闭视频">
    <svg width="20" height="20" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M8 8L40 40" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 40L40 8" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <div id="state"></div>
</div>
<script>
const q = new URLSearchParams(location.search);
let src = q.get('src') || '';
let title = q.get('title') || '';
let poster = q.get('poster') || '';
let startAt = parseFloat(q.get('t') || '0');
let speed = parseFloat(q.get('speed') || '1');
let muted = q.get('muted') === '1';

const v = document.getElementById('v');
const state = document.getElementById('state');
document.getElementById('title').textContent = title;

// 入场：双重 rAF 后给 #wrap 挂 .open，触发淡入 + 微缩到常态（同原版
// playerVideo 的双重 requestAnimationFrame 挂 .player-video-open）。分两帧是
// 为了让首帧先以静息样式落定，第二帧再改类，transition 才会真正跑起来。
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.getElementById('wrap').classList.add('open');
}));

// 顶部拖拽条的唤出热区（原版 playerVideo.tsx 的 syncTitlebarHotzone）：鼠标进入
// 窗口顶部 48px 才唤回拖拽条，离开热区就交给 CSS 的退场延迟淡出。macOS 上原生
// 视频控件的音量条在右上角、画中画按钮在左上角（Windows/Linux 控件在底部），
// 热区避开这两端，否则鼠标去点它们会被唤出的拖拽条压住。
const TITLEBAR_HOTZONE_PX = 48;
const MACOS_HOTZONE_VOLUME_SAFE_PX = 260;
const MACOS_HOTZONE_PIP_SAFE_PX = 120;
const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || '');
// macOS 的系统画中画浮窗没有进度条（原版 playerVideo 的 nativePipUnusable，
// 由 index.tsx 传 isMacOS），隐藏该按钮，避免用户点进去发现调不了进度。
// 原生版的视频本来就是一个常驻独立窗口，画中画是多余的。
if (isMac) { v.disablePictureInPicture = true; }
const syncTitlebarHotzone = (clientX, clientY) => {
  const inSafeZone = isMac &&
    (clientX < MACOS_HOTZONE_PIP_SAFE_PX ||
     clientX >= window.innerWidth - MACOS_HOTZONE_VOLUME_SAFE_PX);
  const inZone = clientY <= TITLEBAR_HOTZONE_PX && !inSafeZone;
  document.body.classList.toggle('titlebar-hover', inZone);
};
document.addEventListener('mousemove',
  (e) => syncTitlebarHotzone(e.clientX, e.clientY), { passive: true });
document.addEventListener('mouseleave',
  () => document.body.classList.remove('titlebar-hover'));

const call = (m, ...a) =>
  (window.mygo ? window.mygo.call(m, ...a).catch(() => {}) : Promise.resolve());

let lastErr = '';
if (src) { v.src = src; }
if (poster) { v.poster = poster; }
if (speed > 0) { v.playbackRate = speed; }
v.muted = muted;

v.addEventListener('error', () => {
  const e = v.error;
  lastErr = e ? `code=${e.code} ${e.message || ''}` : 'unknown';
  state.innerHTML = '播放失败 <span id="err">' + lastErr + '</span>';
  state.style.display = 'block'; // 立刻显形，不等 1s 心跳
  call('Video.Log', 'error: ' + lastErr);
});

// 从主窗带来的播放位置续播。
// 有些 WebKit 版本在第一次 seek 生效前就报了 metadata，所以要重试：
// canPlay 时再校验一次，没同步上就补一次（原版 syncInitialTime 的逻辑）。
let initialSeekPending = startAt > 0;
const syncInitialTime = () => {
  if (!initialSeekPending) return true;
  if (!(startAt > 0) || !isFinite(startAt)) {
    initialSeekPending = false;
    return true;
  }
  if (Math.abs(v.currentTime - startAt) <= 1) {
    initialSeekPending = false;
    return true;
  }
  try { v.currentTime = startAt; } catch (_) {}
  return Math.abs(v.currentTime - startAt) <= 1;
};

v.addEventListener('loadedmetadata', () => {
  syncInitialTime();
  call('Video.Log', `metadata dur=${v.duration.toFixed(1)} size=${v.videoWidth}x${v.videoHeight}`);
});

v.addEventListener('canplay', () => {
  if (syncInitialTime()) call('Video.Log', 'initial-seek synced');
});

// 起播策略（用户反馈「弹窗打开是暂停状态」的修复）：
//
//   1. 先试未静音自动播放。主窗的点击手势不在弹窗里，多数引擎会拒绝，
//      但允许的平台（如 WebKitGTK 默认 media-playback-requires-user-gesture=false）
//      会直接成功——这时有声音。
//   2. 被拦下就静音起播。muted autoplay 是各引擎都放行的路径，保证
//      「打开即在播」，而不是停在暂停态。
//   3. **不在起播后自动取消静音**：WebKit / Chromium 把「无用户手势的取消静音」
//      视为违规并直接**暂停**媒体——这正是旧实现 900ms 后画面停住、用户看到
//      「弹窗是暂停状态」的原因。改为在弹窗里第一次真实手势（点/按键）时再取消
//      静音，用户一交互就有声。
let wantSound = !muted;
const autoplay = async () => {
  let how = 'ok-unmuted';
  v.muted = muted;
  try {
    await v.play();
  } catch (e) {
    try {
      v.muted = true;
      await v.play();
      how = 'ok-muted-only';
    } catch (e2) {
      how = 'blocked:' + e2.name;
      lastErr = 'play() rejected: ' + e2.name;
    }
  }
  call('Video.Log', `autoplay=${how}`);
};
autoplay();

// 原地换集：主窗切集时复用**同一个**弹窗窗口，由 Go 侧调 window.biliSwitch(...)，
// 只换 <video> 的源与起播参数（位置 / 倍速 / 静音）。
//
// 为什么不在 Go 侧关掉窗口再新建：每新建一个弹窗就要起一套 WebView2 渲染进程，
// 换集瞬间「旧的正在拆、新的正在建」两份同时驻留（用户实测切几个视频后内存
// 从 200MB 涨到 315MB）。复用只换 src，进程与页面都留着。
// 起播仍走上面的 autoplay()（未静音 → 被拦则静音起播），与首次打开同一套策略。
window.biliSwitch = (o) => {
  o = o || {};
  lastErr = '';
  startAt = +o.t > 0 && isFinite(+o.t) ? +o.t : 0;
  initialSeekPending = startAt > 0;
  speed = +o.speed > 0 ? +o.speed : 1;
  muted = !!o.muted;
  wantSound = !muted;
  title = o.title || '';
  document.getElementById('title').textContent = title;
  poster = o.poster || '';
  state.style.display = 'none';
  v.poster = poster;
  v.playbackRate = speed;
  v.muted = muted;
  src = o.src || '';
  // 换集立刻重新登记第一次手势的取消静音（上一集的监听已一次性移除）。
  document.addEventListener('pointerdown', onGesture, true);
  document.addEventListener('keydown', onGesture, true);
  if (src) { v.src = src; }
  try { if (startAt > 0) { v.currentTime = startAt; } } catch (_) {}
  autoplay();
  return true;
};

// 第一次真实手势：取消静音（若主窗本来有声音）并确保还在播。
const onGesture = () => {
  if (wantSound && v.muted) { v.muted = false; }
  if (v.paused) { v.play().catch(() => {}); }
  document.removeEventListener('pointerdown', onGesture, true);
  document.removeEventListener('keydown', onGesture, true);
};
document.addEventListener('pointerdown', onGesture, true);
document.addEventListener('keydown', onGesture, true);

// 每秒把状态回传给主窗，用于同步进度与播放状态。
// 正常情况下不显示调试信息，只在出错时显出来。
setInterval(() => {
  call('Video.Report',
    v.currentTime || 0, v.duration || 0,
    !!v.paused, !!v.muted, v.playbackRate || 1, v.readyState || 0,
    lastErr);
  if (lastErr) {
    state.style.display = 'block';
    state.textContent = '播放失败 ' + lastErr;
  } else {
    state.style.display = 'none';
  }
}, 1000);

// 视频模式下的键盘快捷键（原版 index.tsx 的 handleKeyPress，isPlayVideo 分支）：
//   Esc        关闭视频浮层（原版 setIsPlayVideo(false)）
//   空格       播放 / 暂停视频（原版 setIsPlayVideoStop）
//   Ctrl/Cmd+W 最小化（原版 listener 的 minimize_window）
//   Ctrl/Cmd+Q 退出（原版 listener 的 quit_app）
// 原版在这个分支里对其余快捷键直接 return（「播放视频时屏蔽快捷键」）。
//
// Ctrl/Cmd+W/Q 由原版**另一个** keydown listener 处理，它在 isPlayVideo 分支
// 之前执行，所以视频模式下这两条照样生效。弹窗是独立窗口，主窗那套快捷键本来
// 也到不了这里，必须在这里补一份。此前原生版没有这一段：弹窗聚焦时按 Esc 关不掉、
// 按空格也不一定切得了播放（只有 <video> 恰好有焦点时由原生控件接管）。
// 用 !event.repeat 去抖（按住不放不该连发关闭 / 反复切换）。
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  // 修饰键先判：Ctrl/Cmd+W·+Q 要在 Esc/空格 之前，且命中后直接 return，
  // 不再落进下面播放/暂停的分支。
  if (e.metaKey || e.ctrlKey) {
    if (e.key === 'w' || e.key === 'W') {
      e.preventDefault();
      call('Video.Minimize');
      return;
    }
    if (e.key === 'q' || e.key === 'Q') {
      e.preventDefault();
      call('Video.Quit');
      return;
    }
  }
  if (e.code === 'Escape') {
    e.preventDefault();
    call('Video.Close');
  } else if (e.code === 'Space') {
    e.preventDefault();
    if (v.paused) { v.play().catch(() => {}); } else { v.pause(); }
  }
});

document.getElementById('close').addEventListener('click', () => call('Video.Close'));
v.addEventListener('ended', () => call('Video.Ended'));
</script>
</body>
</html>
