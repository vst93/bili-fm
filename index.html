<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>bili-FM</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #eaf5fb;
      }

      #boot-fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #38556a;
        background:
          radial-gradient(circle at 24% 18%, rgba(255, 255, 255, 0.96), transparent 34%),
          radial-gradient(circle at 82% 78%, rgba(125, 211, 252, 0.22), transparent 38%),
          linear-gradient(145deg, #f4fbff 0%, #e8f4fa 54%, #e4f1f7 100%);
      }

      .boot-card {
        display: grid;
        justify-items: center;
        gap: 13px;
        transform: translateY(-8px);
        animation: boot-arrive 360ms cubic-bezier(.2, .8, .2, 1) both;
      }

      .boot-logo-wrap {
        position: relative;
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.52);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          0 16px 40px rgba(46, 103, 137, 0.13);
        backdrop-filter: blur(18px) saturate(1.3);
        -webkit-backdrop-filter: blur(18px) saturate(1.3);
      }

      .boot-logo {
        width: 46px;
        height: 46px;
        object-fit: contain;
      }

      .boot-brand {
        margin: 1px 0 0;
        color: #1f455c;
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.025em;
      }

      .boot-status {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 16px;
        color: #668398;
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .boot-levels {
        height: 13px;
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .boot-levels i {
        width: 2px;
        height: 5px;
        border-radius: 999px;
        background: #31a8df;
        transform-origin: center;
        animation: boot-level 900ms ease-in-out infinite;
      }

      .boot-levels i:nth-child(2) {
        height: 10px;
        animation-delay: -600ms;
      }

      .boot-levels i:nth-child(3) {
        height: 7px;
        animation-delay: -300ms;
      }

      .boot-help {
        position: fixed;
        inset: auto 24px 22px;
        margin: 0;
        color: #7890a0;
        font-size: 11px;
        text-align: center;
        opacity: 0;
        animation: boot-help 200ms ease 8s forwards;
      }

      @keyframes boot-arrive {
        from { opacity: 0; transform: translateY(2px) scale(0.98); }
        to { opacity: 1; transform: translateY(-8px) scale(1); }
      }

      @keyframes boot-level {
        0%, 100% { transform: scaleY(0.45); opacity: 0.55; }
        50% { transform: scaleY(1); opacity: 1; }
      }

      @keyframes boot-help {
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-card,
        .boot-levels i,
        .boot-help {
          animation: none;
        }

        .boot-help {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-logo-wrap">
            <img class="boot-logo" src="/logo-transparent.png" alt="" />
          </div>
          <p class="boot-brand">bili-FM</p>
          <div class="boot-status">
            <span class="boot-levels" aria-hidden="true"><i></i><i></i><i></i></span>
            <span>正在准备播放器</span>
          </div>
        </div>
        <p class="boot-help">启动时间较长，请检查本地服务是否正常运行</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
