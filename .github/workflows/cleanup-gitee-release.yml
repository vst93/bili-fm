name: cleanup gitee release

# 一次性清理工具：删除 Gitee 上误同步的 release（可选同时删 tag）。
# 需要 secrets.GITEE_TOKEN（与 sync_gitee.yml 相同）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要删除的 tag（如 mygo-v3.1.15）'
        required: true
      keep_tag:
        description: '保留 Gitee 上的 git tag (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete release on Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ inputs.tag }}
          KEEP_TAG: ${{ inputs.keep_tag }}
        run: |
          if [ "$KEEP_TAG" = "true" ]; then
            python3 .github/scripts/delete_gitee_release.py --keep-tag
          else
            python3 .github/scripts/delete_gitee_release.py
          fi
