name: Release

# 构建并发布 mygo 原生版。
#
# 与 release-tauri.yml 的分工：那个构建 Tauri 版，这个构建原生版。
# 两个版本的应用内更新**互不兼容**（签名格式不同），所以原生版是独立发布
# 的，老用户需要手动安装一次。
#
# 产物（mygo 直接产出的）：
#   macOS    bili-FM.app + .dmg
#   Windows  bili-FM.exe + NSIS 安装包
#   Linux    .deb + .tar.gz + install.sh
# mygo 不产出 rpm / pacman / MSIX，这里用 nfpm 和手工打包补上 rpm 与 pacman。

on:
  # 发版方式（两种都行）：
  #
  #   1) 直接触发（推荐，版本号自己给）：
  #        gh workflow run release-mygo.yml -f version=3.0.0-preview.2
  #      默认分支现在是 main（mygo 原生版），直接在工作流页面或 `gh workflow run` 触发即可。
  #
  #   2) 推 tag：
  #        git tag mygo-v3.0.0-preview.2 && git push origin mygo-v3.0.0-preview.2
  #
  # 保留 tag 触发作为无需网页入口的发版方式，也顺带把版本号固定在 tag 上。
  push:
    tags:
      - 'mygo-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 3.0.0-preview.1）。仅在 workflow 位于默认分支时可用'
        required: true
      notes:
        description: '更新说明'
        required: false
        default: ''
      prerelease:
        description: '标记为预览版 (true/false)；版本号含 -preview/-rc/-beta/-alpha 时自动为 true'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  APP_DIR: app

jobs:
  # ── 版本号、tag、release ─────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
      prerelease: ${{ steps.prerelease.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算版本号
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#mygo-v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号 $VERSION（来自 $GITHUB_REF_TYPE $GITHUB_REF_NAME）"

      - name: 判断是否预览版
        id: prerelease
        env:
          # 版本号/输入一律走 env 传进来，**不要**在 run 里写 "${{ ... }}"。
          # Actions 的 "${{ }}" 是纯文本拼接：内容被拼进双引号字符串后再交给
          # bash 解析一遍，值里的反引号 / $(…) / $VAR 会被当成代码执行（见下面
          # 「建 release」的注释）。env 是直接放进进程环境变量的，不经过 bash
          # 解析，任何字符都原样到达。
          INPUT_VERSION: ${{ steps.version.outputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          PRE="$INPUT_PRERELEASE"
          VERSION="$INPUT_VERSION"
          # tag 触发时没有 inputs.prerelease，所以按版本号自动判断；
          # 带 -preview/-rc/-beta/-alpha 的算预览版。
          if echo "$VERSION" | grep -qiE '-(alpha|beta|preview|rc)'; then
            PRE="true"
          elif [ -z "$PRE" ]; then
            PRE="false"
          fi
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "预览版: $PRE"

      - name: 生成更新说明
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
          INPUT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -n "$INPUT_NOTES" ]; then
            NOTES="$INPUT_NOTES"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log --pretty=format:"- %s" "$LAST_TAG"..HEAD | head -40)
            else
              COMMITS=$(git log --pretty=format:"- %s" -20)
            fi
            NOTES=$(cat <<EOF
          ## 更新内容

          $COMMITS

          ---

          ## 下载安装

          | 文件 | 平台 |
          |------|------|
          | \`bili-FM-$VERSION-macos-apple-silicon.dmg\` | macOS（Apple Silicon） |
          | \`bili-FM-$VERSION-macos-intel.dmg\` | macOS（Intel） |
          | \`bili-FM-$VERSION-windows-x86_64-setup.exe\` | Windows (x86_64) |
          | \`bili-FM-$VERSION-windows-arm64-setup.exe\` | Windows (ARM64) |
          | \`bili-FM-$VERSION-linux-x86_64.deb\` | Debian/Ubuntu (x86_64) |
          | \`bili-FM-$VERSION-linux-arm64.deb\` | Debian/Ubuntu (ARM64) |
          | \`bili-FM-$VERSION-linux-x86_64.rpm\` | Fedora/RHEL/openSUSE (x86_64) |
          | \`bili-FM-$VERSION-linux-x86_64.pkg.tar.zst\` | Arch Linux (x86_64) |
          | \`bili-fm-$VERSION-linux-amd64.tar.gz\` | 任意 Linux（配 install.sh） |

          > **这是 mygo 原生版**：界面用 Go 原生绘制，音频全走纯 Go 引擎（不需要
          > webview），只有打开视频时才临时起一个 webview 窗口。
          >
          > **应用内更新不跨版本**：原生版与 Tauri 版的更新签名不兼容，从旧版升级
          > 需要手动安装一次。
          EOF
          )
          fi
          {
            echo "notes<<MYGO_EOF"
            echo "$NOTES"
            echo "MYGO_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 建 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新说明（表格里的文件名、commit 标题）只能这样传。以前写成
          #   gh release create ... --notes-file - <<< "${{ steps.notes.outputs.notes }}"
          # Actions 先把 notes 文本拼进这个双引号字符串，bash 再解析一遍，
          # 表格模板里的反引号就成了命令替换：
          #   bili-FM-3.0.1-macos-apple-silicon.dmg: command not found
          # 文件名被替换成空串，release 正文第一列全空。换成环境变量后 bash
          # 只看到变量展开，不再二次解析，反引号 / $(…) / $VAR 都能原样落地。
          VERSION: ${{ steps.version.outputs.version }}
          PRE: ${{ steps.prerelease.outputs.prerelease }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            git tag -f "mygo-v$VERSION" && git push -f origin "mygo-v$VERSION"
          fi
          if gh release view "mygo-v$VERSION" >/dev/null 2>&1; then
            echo "release 已存在，跳过创建"
          else
            gh release create "mygo-v$VERSION" \
              --title "bili-FM (原生版) $VERSION" \
              --notes-file - \
              $([ "$PRE" = "true" ] && echo "--prerelease") <<< "$NOTES"
          fi

  # ── 各平台构建 ──────────────────────────────────────────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # 按架构分开出包：universal 会把两个架构的二进制都塞进同一个 dmg，
          # 体积翻倍，而用户只需要自己架构那一个。Tauri 版也是分开出的。
          - os: macos-latest
            platform: darwin/amd64,darwin/arm64
            label: macos
          - os: ubuntu-22.04
            platform: linux/amd64,linux/arm64
            label: linux
          - os: windows-latest
            platform: windows/amd64,windows/arm64
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum

      - name: 拉依赖
        working-directory: ${{ env.APP_DIR }}
        run: go mod download

      - name: 写入版本号并构建
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        env:
          # 去掉 net/http 的 HTTP/2 实现：B 站 API 与 CDN 用 HTTP/1.1 完全够，
          # 旧版 Tauri 的 reqwest 也特意 ForceAttemptHTTP2=false。省约 1MB 二进制。
          GOFLAGS: "-mod=mod -tags=nethttpomithttp2"
          # 更新签名私钥。用它给每个平台的归档签名并写 update-<target>.json；
          # 应用内置的是对应公钥（mygo.json 的 updates.publicKey）。
          # 没配这个 secret 时构建照常，只是不产出更新文件（应用内更新不可用）。
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # 版本号只写进这次构建的工作区，不提交回分支。
          # 用 -i.bak 是为了同时兼容 GNU sed（Linux）和 BSD sed（macOS）。
          sed -i.bak -E 's/("version"[[:space:]]*:[[:space:]]*")[^"]*/\1'"$VERSION"'/' mygo.json
          rm -f mygo.json.bak
          grep '"version"' mygo.json
          go tool mygo build -platform ${{ matrix.platform }}

      # ── Linux：补 rpm 与 pacman（mygo 不产出）──────────────────────
      - name: 生成 rpm 与 pacman 包
        if: matrix.label == 'linux'
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e
          # bsdtar 在 Ubuntu 上由 libarchive-tools 提供，用来生成 .MTREE
          sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          for PAIR in "amd64:x86_64" "arm64:aarch64"; do
            GOARCH="${PAIR%%:*}"
            PKGARCH="${PAIR##*:}"
            SRC="build/linux-$GOARCH"

            # --- rpm（nfpm）---
            cat > "/tmp/nfpm-$GOARCH.yaml" <<YAML
          name: bili-fm
          arch: $PKGARCH
          platform: linux
          version: $VERSION
          maintainer: vst93 <vst93@users.noreply.github.com>
          description: 用音频收听 B 站内容
          license: MIT
          contents:
            - src: $SRC/bili-fm
              dst: /opt/bili-fm/bili-fm
            # 旧 Tauri 的 deb/rpm 在 /usr/bin/bili-fm 提供命令；mygo 的 deb
            # 由 mygo build 自己建这个软链，但 rpm 是 nfpm 手工打的，必须补上，
            # 否则旧 Tauri updater 重启/旧桌面快捷方式会找不到命令。
            - src: /opt/bili-fm/bili-fm
              dst: /usr/bin/bili-fm
              type: symlink
            - src: $SRC/icon.png
              dst: /usr/share/icons/hicolor/128x128/apps/bili-fm.png
            - src: $SRC/bili-fm.desktop
              dst: /usr/share/applications/bili-fm.desktop
          YAML
            "$(go env GOPATH)/bin/nfpm" package -f "/tmp/nfpm-$GOARCH.yaml" -p rpm -t /tmp/
            # nfpm 会把版本号里的 "-preview.1" 规范化成 "~preview.1"（rpm 的
            # 版本语义），所以按通配取实际文件名，不要拼死。
            RPM=$(ls -t /tmp/bili-fm-*.rpm | head -1)
            mv "$RPM" "$SRC/bili-FM-$VERSION-linux-$PKGARCH.rpm"

            # --- pacman（手工 tar，格式就是 .PKGINFO + 文件树）---
            ROOT=$(mktemp -d)
            install -Dm755 "$SRC/bili-fm" "$ROOT/opt/bili-fm/bili-fm"
            install -Dm644 "$SRC/icon.png" "$ROOT/usr/share/icons/hicolor/128x128/apps/bili-fm.png"
            install -Dm644 "$SRC/bili-fm.desktop" "$ROOT/usr/share/applications/bili-fm.desktop"
            # 与 deb/rpm 保持同一个 /usr/bin/bili-fm 入口（Tauri 升级兼容）。
            install -d "$ROOT/usr/bin"
            ln -s /opt/bili-fm/bili-fm "$ROOT/usr/bin/bili-fm"
            SIZE=$(du -sb "$ROOT" | cut -f1)
            # pacman 的版本格式是 pkgver-pkgrel，**pkgver 里不能有 `-`**；
            # Arch 也没有 Debian/rpm 那种 `~` 预发布约定，惯例是改用 `.`。
            # 直接用 "3.0.0-preview.2-1" 会被 pacman 判为「版本包含无效字符」。
            PKGVER="${VERSION//-/.}-1"
            {
              echo "pkgname = bili-fm"
              echo "pkgver = $PKGVER"
              echo "pkgdesc = 用音频收听 B 站内容"
              echo "url = https://github.com/vst93/bili-fm"
              echo "builddate = $(date +%s)"
              echo "packager = vst93"
              echo "size = $SIZE"
              echo "arch = $PKGARCH"
              echo "license = MIT"
              echo "depend = webkit2gtk-4.1"
              echo "depend = gtk3"
            } > "$ROOT/.PKGINFO"
            # .MTREE 是 pacman 用来校验文件完整性的清单，缺了会警告。
            # 参数照 makepkg 的用法。
            ( cd "$ROOT" && LANG=C bsdtar -czf .MTREE --format=mtree \
                --options='!all,use-set,type,uid,gid,mode,time,size,md5,sha256,link' \
                .PKGINFO opt usr )
            ( cd "$ROOT" && tar --zstd -cf "$OLDPWD/$SRC/bili-FM-$VERSION-linux-$PKGARCH.pkg.tar.zst" .PKGINFO .MTREE opt usr )
            rm -rf "$ROOT"
          done

      # ── 重命名并上传 ───────────────────────────────────────────────
      - name: 收集产物
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e
          mkdir -p ../out
          case "${{ matrix.label }}" in
            macos)
              for PAIR in "arm64:apple-silicon" "amd64:intel"; do
                A="${PAIR%%:*}"; NAME="${PAIR##*:}"
                D="build/darwin-$A"
                [ -d "$D" ] || continue
                if [ -d "$D/bili-FM.app" ]; then
                  (cd "$D" && zip -qry "$OLDPWD/../out/bili-FM-$VERSION-macos-$NAME.app.zip" "bili-FM.app")
                fi
                DMG=$(ls "$D"/*.dmg 2>/dev/null | head -1 || true)
                [ -n "$DMG" ] && cp "$DMG" "../out/bili-FM-$VERSION-macos-$NAME.dmg"
                cp "$D"/bili-fm-*-darwin-$A.tar.gz "../out/" 2>/dev/null || true
                cp "$D"/update-darwin-$A.json "../out/" 2>/dev/null || true
                cp "$D"/*.delta "../out/" 2>/dev/null || true
              done
              ;;
            linux)
              cp build/linux-amd64/*.deb "../out/bili-FM-$VERSION-linux-x86_64.deb"
              cp build/linux-arm64/*.deb "../out/bili-FM-$VERSION-linux-arm64.deb"
              cp build/linux-amd64/*.rpm "../out/bili-FM-$VERSION-linux-x86_64.rpm" 2>/dev/null || true
              cp build/linux-arm64/*.rpm "../out/bili-FM-$VERSION-linux-arm64.rpm" 2>/dev/null || true
              cp build/linux-amd64/*.pkg.tar.zst "../out/bili-FM-$VERSION-linux-x86_64.pkg.tar.zst" 2>/dev/null || true
              cp build/linux-amd64/install.sh ../out/install.sh
              # 更新归档必须用**原名**：update-<target>.json 里的 url 指的就是
              # 这个名字，install.sh 也按 <name>-<version>-<target>.tar.gz 找同
              # 目录的归档。改名会让应用内更新 404、install.sh 找不到包。
              for A in amd64 arm64; do
                cp build/linux-$A/bili-fm-*-linux-$A.tar.gz "../out/" 2>/dev/null || true
                cp build/linux-$A/update-linux-$A.json "../out/" 2>/dev/null || true
                cp build/linux-$A/*.delta "../out/" 2>/dev/null || true
              done
              ;;
            windows)
              for A in amd64 arm64; do
                EXE="build/windows-$A/bili-FM.exe"
                [ -f "$EXE" ] || continue
                cp "$EXE" "../out/bili-FM-$VERSION-windows-$A.exe"
                SETUP=$(ls build/windows-$A/*Setup*.exe 2>/dev/null | head -1 || true)
                [ -n "$SETUP" ] && cp "$SETUP" "../out/bili-FM-$VERSION-windows-$A-setup.exe"
                cp build/windows-$A/bili-fm-*-windows-$A.tar.gz "../out/" 2>/dev/null || true
                cp "build/windows-$A/update-windows-$A.json" "../out/" 2>/dev/null || true
                cp build/windows-$A/*.delta "../out/" 2>/dev/null || true
              done
              ;;
          esac
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: mygo-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  # ── 发布 ────────────────────────────────────────────────────────────
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 上传到 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ls -la artifacts
          gh release upload "mygo-v$VERSION" artifacts/* --clobber --repo "${{ github.repository }}"

      # 更新清单里的 url 必须指向真的传上去的文件。漏传或改名过一次，
      # 应用内更新会在所有平台 404，而且只有用户点了更新才会发现 ——
      # 所以这里在发布时直接卡住。
      - name: 校验更新清单指向的文件都在
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          REPO="${{ github.repository }}"
          gh release view "mygo-v$VERSION" --repo "$REPO" --json assets \
            -q '.assets[].name' > /tmp/published.txt
          FAIL=0
          for f in artifacts/update-*.json; do
            [ -f "$f" ] || continue
            NAME=$(python3 -c "import json,sys,os;print(os.path.basename(json.load(open(sys.argv[1]))['url']))" "$f")
            if grep -qx "$NAME" /tmp/published.txt; then
              echo "  ok   $(basename "$f") -> $NAME"
            else
              echo "::error::$(basename "$f") 指向的 $NAME 不在 release 里，应用内更新会 404"
              FAIL=1
            fi
          done
          [ "$FAIL" = "0" ] || exit 1
          echo "更新清单校验通过"

      - name: 完成
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "已发布：https://github.com/${{ github.repository }}/releases/tag/mygo-v$VERSION"

  # ── Tauri 老用户自动迁移（仅稳定版）──────────────────────────────
  #
  # 老 Tauri 2.x 只认自己的 minisign 和 latest.json，不认识 mygo 的
  # Ed25519 update-*.json。这里用旧 Tauri 私钥签一套迁移包：
  #   - Windows：自定义 NSIS 迁移器（清理旧 Tauri 安装目录/快捷方式，保留
  #     %APPDATA% 数据，静默安装 mygo，启动新程序）；
  #   - macOS：mygo .app.tar.gz；
  #   - Linux：mygo deb/rpm；
  #   - latest.json：Tauri updater schema，挂到当前稳定版 release。
  #
  # 只对非 prerelease 运行。以后每个稳定版都会重新生成最新迁移包，老 Tauri
  # 用户无论何时升级，都会迁移到当时的稳定版。
  bridge:
    needs: [prepare, release]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 NSIS 与 Tauri 签名工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis

      - name: 下载 stable release 资产
        run: |
          rm -rf assets bridge
          mkdir -p assets bridge
          gh release download "mygo-v$VERSION" \
            --repo "$GITHUB_REPOSITORY" --dir assets --clobber
          ls -la assets

      - name: 生成 macOS .app.tar.gz
        shell: bash
        run: |
          set -e
          for NAME in apple-silicon intel; do
            ZIP="assets/bili-FM-$VERSION-macos-$NAME.app.zip"
            [ -f "$ZIP" ] || { echo "missing $ZIP"; exit 1; }
            DIR="tmp/mac-$NAME"
            rm -rf "$DIR"; mkdir -p "$DIR"
            unzip -q "$ZIP" -d "$DIR"
            (cd "$DIR" && tar -czf "$GITHUB_WORKSPACE/bridge/bili-FM-$VERSION-macos-$NAME.app.tar.gz" "bili-FM.app")
          done

      - name: 构建 Windows 迁移器
        shell: bash
        run: |
          set -e
          for A in amd64 arm64; do
            SETUP="$PWD/assets/bili-FM-$VERSION-windows-$A-setup.exe"
            [ -f "$SETUP" ] || { echo "missing $SETUP"; exit 1; }
            makensis \
              -DVER="$VERSION" \
              -DMYGO_SETUP="$SETUP" \
              -DOUT="$PWD/bridge/bili-FM-$VERSION-windows-$A-migrate.exe" \
              scripts/bridge/tauri-migrate.nsi
          done

      - name: 用旧 Tauri 私钥签名
        shell: bash
        run: |
          set -e
          sign() {
            echo "signing $1"
            npx --yes @tauri-apps/cli@2 signer sign "$1"
            test -f "$1.sig"
          }
          for f in bridge/*windows-*-migrate.exe bridge/*macos-*.app.tar.gz; do
            sign "$f"
          done
          for f in assets/bili-FM-$VERSION-linux-*.deb assets/bili-FM-$VERSION-linux-*.rpm; do
            [ -f "$f" ] || continue
            sign "$f"
            cp "$f.sig" bridge/
          done
          ls -la bridge

      - name: 生成 Tauri latest.json
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/bridge/make_tauri_latest.py \
            --version "$VERSION" \
            --base-url "https://github.com/$REPO/releases/download/mygo-v$VERSION" \
            --assets-dir bridge \
            --out bridge/latest.json
          # 旧 Tauri 先查 Gitee；同步到 Gitee 时用这份 URL 指向 Gitee 的清单。
          python3 scripts/bridge/make_tauri_latest.py \
            --version "$VERSION" \
            --base-url "https://gitee.com/vst93/bili-fm/releases/download/mygo-v$VERSION" \
            --assets-dir bridge \
            --out bridge/latest-gitee.json

      - name: 上传迁移包与 latest.json
        shell: bash
        run: |
          gh release upload "mygo-v$VERSION" bridge/* --clobber --repo "$GITHUB_REPOSITORY"
          echo "迁移包已上传到 mygo-v$VERSION"
