name: sync to gitee

on:
  workflow_dispatch:
    inputs:
      core_only:
        description: '只同步应用内更新必需的文件（清单 + 原生归档，先让 Gitee 更新链路可用）'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests requests-toolbelt

      - name: Sync GitHub Release to Gitee
        env:
          GITHUB_OWNER: vst93
          GITHUB_REPO: bili-fm
          GITEE_OWNER: vst93
          GITEE_REPO: bili-fm
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          MAX_WORKERS: '4'
          CORE_ONLY: ${{ inputs.core_only }}
        run: python .github/scripts/sync_gitee.py

      - name: Push code to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          echo "Pushing code to Gitee..."
          git remote add gitee "https://gitee.com/vst93/bili-fm.git"
          AUTH=$(echo -n "oauth2:${GITEE_TOKEN}" | base64)
          # main 是 mygo 原生版；tauri 分支单独保留旧 Tauri 代码。
          BRANCH="${GITHUB_REF_NAME:-main}"
          git -c "http.https://gitee.com/.extraheader=Authorization: Basic ${AUTH}" \
            push gitee "HEAD:${BRANCH}" --force 2>&1
          git remote remove gitee 2>/dev/null || true
          echo "✓ Code pushed to Gitee"
