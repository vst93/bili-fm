name: Build check

# 每次 push 到 main 分支（以及 PR）都把六个目标平台各编译一遍 + 跑测试，
# 防止「只在 Linux 上能编译」的回归（平台专属代码最容易出这种问题）。
#
# 发正式包走 release-mygo.yml（推 mygo-v* tag），这里只做快速门禁。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        run: go build -tags=nethttpomithttp2 ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'

      - name: Vet (host)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go vet ./...

      # internal/view 的像素测试把行盒 / 墨迹 / 量宽钉在「参考中文字体」上
      # （font.go 的 fontStack 在 Linux 上以 Noto Sans CJK SC 作中文回退）。
      # ubuntu-latest（现在是 ubuntu-26.04）不带 Noto CJK：缺字时中文退成
      # 豆腐块，几十条像素断言会集体假红 —— 2026-11 的 main 就一直红在这。
      # 装上字体，让 CI 的门槛与开发机的 ./check.sh 同口径。
      - name: Install CJK fonts (host)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          # runner 的 apt 源偶发 DNS 抖动（"Temporary failure resolving
          # security.ubuntu.com"），一次失败就整条 job 红。重试三次，
          # 每次都先把不完整的下载清掉。
          ok=0
          for i in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk; then
              ok=1
              break
            fi
            echo "apt 第 $i 次失败，10s 后重试" >&2
            sudo apt-get clean || true
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "装 fonts-noto-cjk 连续三次失败（runner 网络问题，不是代码回归）" >&2
            exit 1
          fi
          fc-cache -f >/dev/null
          fc-match "Noto Sans CJK SC"

      - name: Test (host)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -count=1 -timeout=30m ./...
