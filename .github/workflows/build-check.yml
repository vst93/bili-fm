name: Build check

# 每次 push 到 main 分支（以及 PR）都把六个目标平台各编译一遍 + 跑测试，
# 防止「只在 Linux 上能编译」的回归（平台专属代码最容易出这种问题）。
#
# 发正式包走 release-mygo.yml（推 mygo-v* tag），这里只做快速门禁。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        run: go build -tags=nethttpomithttp2 ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'

      - name: Vet (host)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go vet ./...

      # internal/view 的像素测试把行盒 / 墨迹 / 量宽钉在「参考中文字体」上
      # （font.go 的 fontStack 在 Linux 上以 Noto Sans CJK SC 作中文回退）。
      # ubuntu-latest（现在是 ubuntu-26.04）不带 Noto CJK：缺字时中文退成
      # 豆腐块，几十条像素断言会集体假红 —— 2026-11 的 main 就一直红在这。
      #
      # **不再走 apt**：这台 runner 的 apt 源会 DNS 抖成
      # 「Temporary failure resolving security.ubuntu.com」，重试三次跨 15 分钟
      # 全部失败（实测）。raw.githubusercontent.com 反而是稳的（checkout 就靠它），
      # 直接从 noto-cjk 官方仓库拿**同一个字体族**的 Regular 合集，
      # 再用 actions/cache 缓存，常态下零下载。
      - name: Cache CJK font
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/cache@v4
        with:
          path: ~/.fonts/NotoSansCJK-Regular.ttc
          key: noto-cjk-regular-ttc-v1

      - name: Install CJK font (host)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          mkdir -p ~/.fonts
          if [ ! -s ~/.fonts/NotoSansCJK-Regular.ttc ]; then
            curl -fsSL --retry 3 --retry-delay 5 --max-time 180 \
              -o ~/.fonts/NotoSansCJK-Regular.ttc \
              https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTC/NotoSansCJK-Regular.ttc
          fi
          fc-cache -f >/dev/null
          fc-match "Noto Sans CJK SC" | grep -q "Noto Sans CJK SC"

      - name: Test (host)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -count=1 -timeout=30m ./...
