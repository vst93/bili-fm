name: gitee issue reply (temp)

# 临时工作流：本地没有 GITEE_TOKEN，用仓库 secret 关闭 Gitee issue。
# 跑完即删，不要留在仓库里。
#
# 注意：Gitee 的「更新 Issue」是 PATCH /v5/repos/{owner}/issues/{number}
# （路径里**没有** repo 段，repo 走表单参数）——照搬仓库级路径会 404
# "project or enterprise"。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Close on Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request, urllib.error

          token = os.environ["GITEE_TOKEN"]
          url = "https://gitee.com/api/v5/repos/vst93/issues/IKILM7"
          form = urllib.parse.urlencode({
              "access_token": token,
              "repo": "bili-fm",
              "state": "closed",
          }).encode()
          req = urllib.request.Request(url, data=form, method="PATCH")
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print(r.status, r.read().decode()[:200])
          except urllib.error.HTTPError as e:
              print("HTTPError", e.code, e.read().decode()[:200])
          PY
