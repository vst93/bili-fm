name: Release Store

# 构建 Microsoft Store MSIX，并可选择用 Partner Center API 提交。
#
# 重要：Store 包的 Identity / Publisher / Store ID 必须与现有 Tauri 版
# 完全一致，否则会被当成新应用（丢失商店列表、自动更新和包内数据）：
#   Identity Name: vvv.bilifm
#   Publisher:     CN=21D233E1-6650-4700-A43E-EDA723C43F96
#   Store ID:      9N0LNL3JM3GG
#
# 只发稳定版本，版本号必须是四段 numeric（3.1.1 -> 3.1.1.0）。当前商店版
# 2.0.37.0，因此 3.1.1.0 是合法升级。
#
# 两种用法：
#   1) 手动构建 / 提交：workflow_dispatch（submit=true 才会提交商店）；
#   2) release-mygo.yml 在稳定版发布后自动调用本工作流（submit=false），
#      只构建 MSIX 并附加到 GitHub Release。商店提交仍保持手动。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Store 版本（如 3.1.1，不带 -preview）'
        required: true
        default: '3.1.1'
      submit:
        description: '构建后立即提交到 Microsoft Store（true/false）'
        required: true
        default: 'false'
      notes:
        description: '提交备注（可选）'
        required: false
        default: 'mygo native'
  workflow_call:
    inputs:
      version:
        description: 'Store 版本'
        required: true
        type: string
      submit:
        description: '是否提交到 Microsoft Store'
        required: false
        default: 'false'
        type: string
      notes:
        description: '提交备注'
        required: false
        default: 'mygo native'
        type: string

permissions:
  contents: write

env:
  APP_DIR: app
  STORE_ID: '9N0LNL3JM3GG'

jobs:
  store:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum

      - name: 写入版本并构建 Windows x64
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        env:
          GOFLAGS: '-mod=mod -tags=nethttpomithttp2'
          VERSION: ${{ inputs.version }}
        run: |
          sed -i.bak -E 's/("version"[[:space:]]*:[[:space:]]*")[^"]*/\1'"$VERSION"'/' mygo.json
          rm -f mygo.json.bak
          grep '"version"' mygo.json
          go tool mygo build -platform windows/amd64

      - name: 打包 MSIX
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./scripts/store/package-store.ps1 `
            -Version "$env:VERSION" `
            -ExeDir "app/build/windows-amd64" `
            -Icon "app/resources/icon.png"

      - uses: actions/upload-artifact@v4
        with:
          name: bili-fm-store-msix
          path: build/msix/*.msix
          if-no-files-found: error

      - name: 附加到 GitHub Release（如果存在）
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "mygo-v$VERSION" >/dev/null 2>&1; then
            gh release upload "mygo-v$VERSION" build/msix/*.msix --clobber
          fi

      - name: 提交到 Microsoft Store
        if: ${{ inputs.submit == 'true' }}
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          python -m pip install --quiet requests requests-toolbelt
          python scripts/store/submit_to_store.py build/msix/bili-FM-windows-amd64.msix
